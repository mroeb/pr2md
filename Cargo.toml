[package]
name = "pr2md"
version = "0.2.0"
edition = "2024"
description = "Mirror the GitHub pull requests you are involved in into Obsidian-friendly Markdown"
license = "MIT"

[features]
default = ["tray", "gui"]
tray = ["dep:tray-icon", "dep:winit"]
gui = ["dep:eframe"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "clipboard", "wayland", "x11"] }
tray-icon = { version = "0.26", optional = true, default-features = false }
winit = { version = "0.30", optional = true }

# Linux: talk to the tray via D-Bus (StatusNotifierItem) -> no GTK needed
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Memory"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
